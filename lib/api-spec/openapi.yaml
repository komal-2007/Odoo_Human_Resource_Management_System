openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification

servers:
  - url: /api
    description: Base API path

tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and account operations
  - name: employees
    description: Admin/HR employee management
  - name: leave
    description: Employee leave requests and Admin/HR decisions
  - name: attendance
    description: Employee attendance and check-in/check-out operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Server is running but the database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with a Login ID or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Authentication required

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
        "400":
          description: Invalid password
        "401":
          description: Authentication required

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Employee accounts
        "401":
          description: Authentication required
        "403":
          description: Admin/HR access required

    post:
      operationId: createEmployee
      tags: [employees]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: Employee account created
        "400":
          description: Invalid employee details
        "401":
          description: Authentication required
        "403":
          description: Admin/HR access required

  /employees/me:
    get:
      operationId: getMyEmployeeProfile
      tags: [employees]
      summary: Get my employee profile
      description: Employee-authenticated. Returns the current user's employee profile without authentication secrets.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current employee profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfile"
        "401":
          description: Authentication required
        "403":
          description: Employee access required
        "404":
          description: Employee profile not found

    patch:
      operationId: updateMyEmployeeProfile
      tags: [employees]
      summary: Update my employee profile
      description: Employee-authenticated. Updates only first name, last name, and phone. Login ID, role, and password fields cannot be changed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyEmployeeProfileRequest"
      responses:
        "200":
          description: Current employee profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfile"
        "400":
          description: Invalid profile details
        "401":
          description: Authentication required
        "403":
          description: Employee access required
        "404":
          description: Employee profile not found

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee profile
      description: Admin/HR-authenticated. Returns the requested employee profile without authentication secrets.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Employee profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfile"
        "401":
          description: Authentication required
        "403":
          description: Admin/HR access required
        "404":
          description: Employee profile not found

    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee profile
      description: Admin/HR-authenticated. Updates existing profile fields. Login ID and password authentication fields are not changed.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: Employee profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfile"
        "400":
          description: Invalid profile details
        "401":
          description: Authentication required
        "403":
          description: Admin/HR access required
        "404":
          description: Employee profile not found
        "409":
          description: Email or employee code already exists

  /leave-requests:
    post:
      operationId: createLeaveRequest
      tags: [leave]
      summary: Submit a leave request
      description: Employee-authenticated. Creates a pending leave request for the current user's employee profile.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeaveRequest"
      responses:
        "201":
          description: Leave request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          description: Invalid leave request details
        "401":
          description: Authentication required
        "403":
          description: Employee access required
        "404":
          description: Employee profile not found

    get:
      operationId: listLeaveRequests
      tags: [leave]
      summary: List all leave requests
      description: Admin/HR-authenticated. Each item includes the related employee summary.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: All leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveRequest"
        "401":
          description: Authentication required
        "403":
          description: Admin/HR access required

  /leave-requests/me:
    get:
      operationId: listMyLeaveRequests
      tags: [leave]
      summary: List my leave requests
      description: Employee-authenticated. Returns only the current employee's leave requests.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current employee leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveRequest"
        "401":
          description: Authentication required
        "403":
          description: Employee access required
        "404":
          description: Employee profile not found

  /leave-requests/{id}/status:
    patch:
      operationId: decideLeaveRequestStatus
      tags: [leave]
      summary: Approve or reject a pending leave request
      description: Admin/HR-authenticated. Only pending leave requests can be decided.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveDecisionRequest"
      responses:
        "200":
          description: Leave request updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          description: Invalid decision
        "401":
          description: Authentication required
        "403":
          description: Admin/HR access required
        "404":
          description: Leave request not found
        "409":
          description: Leave request is not pending

  /attendance/check-in:
    post:
      operationId: checkIn
      tags: [attendance]
      summary: Check in for today
      description: Employee-authenticated. Creates or updates the current employee's attendance record for today.
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Attendance check-in recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "401":
          description: Authentication required
        "403":
          description: Employee access required
        "404":
          description: Employee profile not found
        "409":
          description: Employee has already checked in

  /attendance/check-out:
    post:
      operationId: checkOut
      tags: [attendance]
      summary: Check out for today
      description: Employee-authenticated. Records the current employee's checkout time.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Attendance check-out recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "401":
          description: Authentication required
        "403":
          description: Employee access required
        "404":
          description: Employee profile not found
        "409":
          description: Check-in is required or employee has already checked out

  /attendance/me:
    get:
      operationId: getMyAttendance
      tags: [attendance]
      summary: Get my attendance
      description: Employee-authenticated. Returns attendance records belonging only to the current employee.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Current employee attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Invalid date filters
        "401":
          description: Authentication required
        "403":
          description: Employee access required
        "404":
          description: Employee profile not found

  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List employee attendance
      description: Admin/HR-authenticated. Returns attendance records for employees.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: employeeId
          in: query
          required: false
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Invalid date
        "401":
          description: Authentication required
        "403":
          description: Admin/HR access required

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: boolean
      required:
        - status
        - database

    LoginRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }

    CreateEmployeeRequest:
      type: object
      required: [email, firstName, lastName, employeeCode, dateOfJoining]
      properties:
        email: { type: string, description: Valid email address }
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        employeeCode: { type: string, minLength: 1, maxLength: 40 }
        phone: { type: string, maxLength: 30 }
        department: { type: string, maxLength: 100 }
        jobTitle: { type: string, maxLength: 100 }
        dateOfJoining: { type: string, format: date }

    UpdateMyEmployeeProfileRequest:
      type: object
      additionalProperties: false
      properties:
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: string, maxLength: 30 }

    UpdateEmployeeRequest:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, description: Valid email address }
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: string, maxLength: 30 }
        department: { type: string, maxLength: 100 }
        jobTitle: { type: string, maxLength: 100 }
        employeeCode: { type: string, minLength: 1, maxLength: 40 }

    EmployeeProfile:
      type: object
      required:
        - id
        - userId
        - employeeCode
        - firstName
        - lastName
        - createdAt
        - updatedAt
        - user
      properties:
        id: { type: string }
        userId: { type: string }
        employeeCode: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string, nullable: true }
        department: { type: string, nullable: true }
        jobTitle: { type: string, nullable: true }
        dateOfJoining: { type: string, format: date-time, nullable: true }
        joiningYear: { type: number, nullable: true }
        joiningSerial: { type: number, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/UserResponse" }

    UserResponse:
      type: object
      required: [id, loginId, email, role]
      properties:
        id: { type: string }
        loginId: { type: string }
        email: { type: string, description: Valid email address }
        role: { type: string, enum: [ADMIN, EMPLOYEE] }
        mustChangePassword: { type: boolean }

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/UserResponse" }

    LeaveType:
      type: string
      enum: [ANNUAL, SICK, CASUAL, UNPAID, OTHER]

    LeaveStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    CreateLeaveRequest:
      type: object
      required: [leaveType, startDate, endDate, reason]
      properties:
        leaveType: { $ref: "#/components/schemas/LeaveType" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string, minLength: 1, maxLength: 1000 }

    LeaveDecisionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [APPROVED, REJECTED]

    LeaveEmployeeSummary:
      type: object
      required: [id, employeeCode, firstName, lastName, user]
      properties:
        id: { type: string }
        employeeCode: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        user: { $ref: "#/components/schemas/UserResponse" }

    LeaveRequest:
      type: object
      required:
        - id
        - employeeId
        - leaveType
        - startDate
        - endDate
        - reason
        - status
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        employeeId: { type: string }
        leaveType: { $ref: "#/components/schemas/LeaveType" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string }
        status: { $ref: "#/components/schemas/LeaveStatus" }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewedById: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        employee:
          $ref: "#/components/schemas/LeaveEmployeeSummary"

    AttendanceStatus:
      type: string
      enum: [PRESENT, ABSENT, HALF_DAY, ON_LEAVE]

    AttendanceRecord:
      type: object
      required:
        - id
        - employeeId
        - workDate
        - status
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        employeeId: { type: string }
        workDate: { type: string, format: date }
        checkIn: { type: string, format: date-time, nullable: true }
        checkOut: { type: string, format: date-time, nullable: true }
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        workedMinutes: { type: number, nullable: true }
        workedHours: { type: number, nullable: true }
        extraMinutes: { type: number, nullable: true }
        extraHours: { type: number, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }